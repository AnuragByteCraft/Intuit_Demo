server:
  port: 8080
demo:
  schedules:
    aggregationDelayMs: 15000
    reconciliationDelayMs: 60000
    forecastDelayMs: 3600000   # 1 hour (only used when forecast schedule is enabled)
  topn:
    defaultN: 10
    maxN: 50
  forecast:
    historyDays: 90
    horizonDaysDefault: 7
    scheduleEnabled: false    # set true to run forecast on a schedule for all tenants
    minHistoryDaysForProphet: 28   # use Prophet when points >= this; else moving average
    minPointsForBaseline: 1   # minimum daily data points for baseline (demo: 1 day of data is enough)
    prophetPythonPath: .venv/bin/python3   # Python executable (use .venv for project venv, or "python3" for system)
    prophetScriptPath: scripts/prophet_predict.py   # path to script (relative to project root when running from QB-TopNService)
management:
  endpoints:
    web:
      exposure:
        include: health,info
